services:
  inkpanel:
    build: .
    image: inkpanel:local
    container_name: inkpanel
    restart: unless-stopped
    ports:
      - "8080:8080"
      # WebSerial is available only from a secure browser context. InkPanel's
      # self-signed HTTPS listener exists specifically for the Flash tab.
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    volumes:
      - inkpanel-data:/data
    environment:
      # The address panels can reach this host on. The Flash tab uses this to
      # pre-fill a new board's server address, and its valid host/IP is added
      # to the browser HTTPS certificate. Leave empty only if the
      # container's own auto-detected address is actually reachable by panels;
      # with normal Docker bridge networking it usually is not, so set the
      # Docker host's LAN address explicitly, e.g. http://192.168.1.50:8080.
      PUBLIC_BASE_URL: ""
      # Browser-only HTTPS/WebSerial port. The same value configures both the
      # container listener and the host publication above.
      HTTPS_PORT: "${HTTPS_PORT:-8443}"
      # Explicit opt-in for calendars hosted on a private LAN address.
      # Loopback and link-local destinations remain blocked.
      CALENDAR_ALLOW_PRIVATE_NETWORKS: "${CALENDAR_ALLOW_PRIVATE_NETWORKS:-0}"
      # Optional National Rail/RDM Live Departure Board transport. The current
      # RDM v1.1 product authenticates with the Consumer key in the x-apikey
      # request header. Keep the key in your local Compose .env or secret store.
      NATIONAL_RAIL_LDB_API_KEY: "${NATIONAL_RAIL_LDB_API_KEY:-}"
      # Optional override for a future RDM gateway migration; normally omit it.
      NATIONAL_RAIL_LDB_BASE_URL: "${NATIONAL_RAIL_LDB_BASE_URL:-}"
      # Uncomment to require a password for the web UI. The panel's own
      # endpoint (/api/devices/:id/frame) and /health stay open regardless,
      # since firmware cannot log in. NOTE: this is plain HTTP — the password
      # crosses your network in clear text; protection against casual access
      # only, not against a hostile network.
      # INKPANEL_PASSWORD: "change-me"
      # Set this if this container sits behind a reverse proxy. Without it,
      # req.ip is the proxy's own address for every client, so the login rate
      # limiter buckets everyone together — one bad-login burst locks out
      # every client for 15 minutes. Set to the number of proxy hops in front
      # of the server (usually 1), or a comma-separated list of trusted
      # addresses/subnets. See https://expressjs.com/en/guide/behind-proxies.html.
      # TRUST_PROXY: "1"
    # Chromium needs more than Docker's 64MB default for /dev/shm.
    shm_size: "512mb"

volumes:
  inkpanel-data:
